<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mozgástámogató</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f5f6;
    color: #222;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 24px 16px 50px;
}

h1 {
    margin-bottom: 4px;
}

.subtitle {
    color: #666;
    margin-top: 0;
    margin-bottom: 28px;
}

.week {
    display: grid;
    gap: 10px;
}

.day {
    background: white;
    border-radius: 12px;
    padding: 14px;
    display: grid;
    grid-template-columns: 100px 1fr;
    align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

.day-name {
    font-weight: bold;
}

.choices {
    display: flex;
    gap: 8px;
}

button.choice {
    flex: 1;
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 10px 4px;
    cursor: pointer;
    font-weight: bold;
    background: #eee;
}

button.choice.selected {
    border-color: #222;
}

.E {
    background: #dcefdc !important;
}

.M {
    background: #dce8f5 !important;
}

.P {
    background: #eeeeee !important;
}

#checkButton {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#message {
    margin-top: 18px;
    padding: 14px;
    border-radius: 10px;
    display: none;
}

.success {
    background: #e3f3e3;
}

.error {
    background: #f7dddd;
}

.counter {
    margin-top: 18px;
    text-align: center;
    color: #555;
}

#result {
    display: none;
    margin-top: 28px;
}

.result-day {
    background: white;
    margin-bottom: 9px;
    padding: 14px;
    border-radius: 10px;
    display: grid;
    grid-template-columns: 100px 1fr;
    align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

.program-name {
    font-weight: bold;
}

.program-detail {
    font-size: 14px;
    color: #666;
    margin-top: 3px;
}
</style>
</head>

<body>

<div class="container">

    <h1>Mozgástámogató</h1>
    <p class="subtitle">Heti tervező · Kezdő szint</p>

    <div class="week" id="week"></div>

    <div class="counter" id="counter">
        Edzés: 0/2 · Mozgás: 0/3 · Pihenő: 0/2
    </div>

    <button id="checkButton" onclick="checkWeek()">
        Heti terv ellenőrzése
    </button>

    <div id="message"></div>

    <div id="result">
        <h2>A heti programod</h2>
        <div id="schedule"></div>
    </div>

</div>

<script>

const days = [
    "Hétfő",
    "Kedd",
    "Szerda",
    "Csütörtök",
    "Péntek",
    "Szombat",
    "Vasárnap"
];

const plan = Array(7).fill(null);
let nextStrength = localStorage.getItem("nextStrength") || "A";
let nextMovement = localStorage.getItem("nextMovement") || "M1";
    const week = document.getElementById("week");

days.forEach((day, index) => {

    const row = document.createElement("div");
    row.className = "day";

    row.innerHTML = `
        <div class="day-name">${day}</div>

        <div class="choices">
            <button class="choice E"
                onclick="selectDay(${index}, 'E', this)">
                E
            </button>

            <button class="choice M"
                onclick="selectDay(${index}, 'M', this)">
                M
            </button>

            <button class="choice P"
                onclick="selectDay(${index}, 'P', this)">
                P
            </button>
        </div>
    `;

    week.appendChild(row);
});


function selectDay(index, type, button) {

    plan[index] = type;

    const buttons =
        button.parentElement.querySelectorAll(".choice");

    buttons.forEach(b =>
        b.classList.remove("selected")
    );

    button.classList.add("selected");

    updateCounter();

    document.getElementById("message").style.display = "none";
    document.getElementById("result").style.display = "none";
}


function updateCounter() {

    const e = plan.filter(x => x === "E").length;
    const m = plan.filter(x => x === "M").length;
    const p = plan.filter(x => x === "P").length;

    document.getElementById("counter").textContent =
        `Edzés: ${e}/2 · Mozgás: ${m}/3 · Pihenő: ${p}/2`;
}


function checkWeek() {

    if (plan.includes(null)) {
        showError("⚠ Minden naphoz válassz státuszt.");
        return;
    }

    const e = plan.filter(x => x === "E").length;
    const m = plan.filter(x => x === "M").length;
    const p = plan.filter(x => x === "P").length;

    if (e !== 2 || m !== 3 || p !== 2) {
        showError(
            "⚠ A heti arány: 2 edzésnap · 3 mozgásnap · 2 pihenőnap."
        );
        return;
    }

    for (let i = 0; i < 6; i++) {
        if (plan[i] === "E" && plan[i + 1] === "E") {
            showError(
                "⚠ Két edzésnap nem kerülhet egymás mellé."
            );
            return;
        }
    }

    for (let i = 0; i < 5; i++) {
        if (
            plan[i] === "P" &&
            plan[i + 1] === "P" &&
            plan[i + 2] === "P"
        ) {
            showError(
                "⚠ Három pihenőnap nem kerülhet egymás mellé."
            );
            return;
        }
    }

    showSuccess();
    createSchedule();
}


function showError(text) {

    const message = document.getElementById("message");

    message.style.display = "block";
    message.className = "error";
    message.textContent = text;

    document.getElementById("result").style.display = "none";
}


function showSuccess() {

    const message = document.getElementById("message");

    message.style.display = "block";
    message.className = "success";
    message.textContent = "✓ Heti terv elfogadva.";
}


function createSchedule() {

    const schedule = document.getElementById("schedule");
    schedule.innerHTML = "";

    let strengthIndex = nextStrength === "A" ? 0 : 1;
    let movementIndex =
    nextMovement === "M1" ? 0 :
    nextMovement === "M2" ? 1 : 2;

    const strengthPrograms = [
        {
            code: "A",
            name: "Teljes test",
            detail: "30–40 perc"
        },
        {
            code: "B",
            name: "Teljes test",
            detail: "30–40 perc"
        }
    ];

    const movementPrograms = [
        {
            code: "M1",
            name: "Futás–séta",
            detail: "kb. 28 perc"
        },
        {
            code: "M2",
            name: "Mobilitás + jóga",
            detail: "kb. 30 perc"
        },
        {
            code: "M3",
            name: "Elliptikus + mobilitás",
            detail: "kb. 30 perc"
        }
    ];

    plan.forEach((type, index) => {

        let code = "";
        let name = "";
        let detail = "";

        if (type === "E") {

            const program =
                strengthPrograms[strengthIndex];

            code = program.code;
            name = program.name;
            detail = program.detail;

            strengthIndex = strengthIndex === 0 ? 1 : 0;
        }

        if (type === "M") {

            const program =
                movementPrograms[movementIndex];

            code = program.code;
            name = program.name;
            detail = program.detail;

            movementIndex = (movementIndex + 1) % 3;
        }

        if (type === "P") {
            code = "P";
            name = "Pihenőnap";
            detail = "Tervezett regeneráció";
        }

        const row = document.createElement("div");
        row.className = "result-day";

        row.innerHTML = `
            <div class="day-name">${days[index]}</div>

            <div>
                <div class="program-name">
                   <button onclick="openProgram('${code}')" class="program-button">
    ${code} · ${name}
</button>
                </div>

                <div class="program-detail">
                    ${detail}
                </div>
            </div>
        `;

        schedule.appendChild(row);
    });

    document.getElementById("result").style.display = "block";
}
function openProgram(code) {

    if (code !== "A" && code !== "B" && code !== "M1" && code !== "M2" && code !== "M3") {
        return;
    }

    const existingView = document.getElementById("programView");

    if (existingView) {
        existingView.remove();
    }
let title = "";
let duration = "";
let warmup = "";
let mainPart = "";
let cooldown = "";

if (code === "A") {

    title = "A · Teljes test";
    duration = "30–40 perc · felső határ: 45 perc";

    warmup = `
        <p>☐ Könnyű séta futópadon – 2 perc</p>
        <p>☐ Bokakörzés – 5-5 kör mindkét irányba</p>
        <p>☐ Boka mobilizálás, térd előre a lábfej fölé – 8/oldal</p>
        <p>☐ Vállkörzés – 8 előre + 8 hátra</p>
        <p>☐ Gumiszalag széthúzás mellmagasságban – 8–10</p>
        <p>☐ Macska–tehén – 6–8</p>
        <p>☐ Sekély guggolás – 6</p>
        <p>☐ Csípőhajlítás súly nélkül – 6</p>
    `;

    mainPart = `
        <p>☐ Székre guggolás – 2×8</p>
        <p>☐ Gumiszalagos evezés – 2×10</p>
        <p>☐ Fali vagy magas támaszos fekvőtámasz – 2×8</p>
        <p>☐ Csípőemelés – 2×10</p>
        <p>☐ Álló vádliemelés kapaszkodva – 2×10</p>
        <p>☐ Dead bug – 2×6/oldal</p>
    `;
}

if (code === "B") {

    title = "B · Teljes test";
    duration = "30–40 perc · felső határ: 45 perc";

    warmup = `
        <p>☐ Könnyű séta futópadon – 2 perc</p>
        <p>☐ Bokakörzés – 5-5 kör mindkét irányba</p>
        <p>☐ Boka mobilizálás, térd előre a lábfej fölé – 8/oldal</p>
        <p>☐ Vállkörzés – 8 előre + 8 hátra</p>
        <p>☐ Gumiszalag széthúzás mellmagasságban – 8–10</p>
        <p>☐ Macska–tehén – 6–8</p>
        <p>☐ Sekély guggolás – 6</p>
        <p>☐ Csípőhajlítás súly nélkül – 6</p>
    `;

    mainPart = `
        <p>☐ Hátralépéses kitörés kapaszkodva – 2×6/oldal</p>
        <p>☐ Gumiszalagos lehúzás vagy evezés – 2×10</p>
        <p>☐ Könnyű kézisúlyzós vállgyakorlat – 2×8</p>
        <p>☐ Csípőhajlítás súly nélkül – 2×8</p>
        <p>☐ Oldalazó lépések gumiszalaggal – 2×8/irány</p>
        <p>☐ Bird dog – 2×6/oldal</p>
    `;
}
if (code === "M1") {

    title = "M1 · Futás–séta";
    duration = "kb. 28 perc · felső határ: ennyi";

    warmup = `
        <p>☐ Könnyű vagy tempós séta – 5 perc</p>
    `;

    mainPart = `
        <p>☐ 1 perc nagyon könnyű futás + 2 perc séta × 6</p>
    `;

    cooldown = `
        <p>☐ Könnyű séta – 5 perc</p>
        <p><strong>Az utolsó futószakasz után tilos megnézni, meddig bírod még.</strong></p>
    `;
}
if (code === "M2") {

    title = "M2 · Mobilitás + jóga";
    duration = "kb. 25–30 perc";

    warmup = `
        <p>☐ Könnyű helyben járás – 2 perc</p>
        <p>☐ Boka mobilizálás, térd előre a lábfej fölé – 8/oldal</p>
        <p>☐ Bokakörzés kapaszkodva – 6+6/oldal</p>
        <p>☐ Lassú vállkörzés – 8 előre + 8 hátra</p>
        <p>☐ Fali karcsúsztatás – 8</p>
    `;

    mainPart = `
        <p>☐ Macska–tehén – 8</p>
        <p>☐ Gyermekpóz – 30 mp</p>
        <p>☐ Lefelé néző kutya – 20–30 mp</p>
        <p>☐ Alacsony kitörés – 30 mp/oldal</p>
        <p>☐ Harcos II – 30 mp/oldal</p>
        <p>☐ Kíméletes ülő előrehajlás – 30 mp</p>
        <p>☐ Térdhúzás mellkashoz hanyatt fekve – 30 mp/oldal</p>
        <p>☐ Hanyatt fekvő gerinccsavarás – 30 mp/oldal</p>
    `;

    cooldown = `
        <p>☐ Nyugodt hanyatt fekvő pihenés – 2 perc</p>
        <p><strong>Kényelmes mozgástartomány. Nincs mélyítés, nincs plusz kör.</strong></p>
    `;
}
    if (code === "M3") {

    title = "M3 · Elliptikus + mobilitás";
    duration = "kb. 30 perc";

    warmup = `
        <p>☐ Nagyon könnyű elliptikus bemelegítés – 3 perc</p>
    `;

    mainPart = `
        <p>☐ Egyenletes, könnyű elliptikus mozgás – 20 perc</p>
        <p>☐ Fokozatos lassítás – 2 perc</p>
    `;

    cooldown = `
        <p>☐ Vállkörzés – 8 előre + 8 hátra</p>
        <p>☐ Fali karcsúsztatás – 8</p>
        <p>☐ Boka mobilizálás, térd előre a lábfej fölé – 8/oldal</p>
        <p>☐ Bokakörzés – 6+6/oldal</p>
        <p><strong>Az elliptikus rész felső határa összesen 25 perc. Nincs hosszabbítás.</strong></p>
    `;
}
    if (code === "A" || code === "B") {
    cooldown = `
    <p>☐ Nagyon lassú séta – 1–2 perc</p>
    <p>☐ Vádlinyújtás – 20–30 mp/oldal</p>
    <p>☐ Combfeszítő nyújtás – 20–30 mp/oldal</p>
    <p>☐ Farizom/csípő nyújtás – 20–30 mp/oldal</p>
    <p>☐ Mellkasnyújtás ajtófélfánál – 20–30 mp/oldal</p>
    <p>☐ Váll keresztbe húzott nyújtása – 20–30 mp/oldal</p>
`;
    }
    const programView = document.createElement("div");
    programView.id = "programView";

    programView.innerHTML = `
        <div style="
            margin-top: 28px;
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
        ">

            <h2 style="margin-top: 0;">${title}</h2>
            <p style="color:#666;">
                ${duration}
            </p>

            <h3>Bemelegítés</h3>

            ${warmup}

            <h3>Fő rész</h3>

            ${mainPart}

            <h3>Levezetés</h3>

            ${cooldown}
            <button
                onclick="finishWorkout()"
                style="
                    width:100%;
                    margin-top:20px;
                    padding:14px;
                    border:none;
                    border-radius:10px;
                    font-size:16px;
                    font-weight:bold;
                    cursor:pointer;
                ">
                Edzés befejezése
            </button>

            <div
                id="finishMessage"
                style="
                    display:none;
                    margin-top:16px;
                    padding:14px;
                    border-radius:10px;
                    background:#e3f3e3;
                    font-weight:bold;
                ">
                ✓ Mai program teljesítve. Ráadás nem szükséges.
            </div>

        </div>
    `;

    document.querySelector(".container").appendChild(programView);

    programView.scrollIntoView({
        behavior: "smooth"
    });
}


function finishWorkout() {

    const programTitle = document.querySelector("#programView h2").textContent;

    const completed = {
        program: programTitle,
        completedAt: new Date().toISOString()
    };

    localStorage.setItem(
        "lastCompletedWorkout",
        JSON.stringify(completed)
    );
if (programTitle.startsWith("A")) {
    nextStrength = "B";
    localStorage.setItem("nextStrength", nextStrength);
}

if (programTitle.startsWith("B")) {
    nextStrength = "A";
    localStorage.setItem("nextStrength", nextStrength);
}
    document.getElementById("finishMessage").style.display = "block";

    if (programTitle.startsWith("M1")) {
    nextMovement = "M2";
    localStorage.setItem("nextMovement", nextMovement);
}

if (programTitle.startsWith("M2")) {
    nextMovement = "M3";
    localStorage.setItem("nextMovement", nextMovement);
}

if (programTitle.startsWith("M3")) {
    nextMovement = "M1";
    localStorage.setItem("nextMovement", nextMovement);
}
}
</script>

</body>
</html>
